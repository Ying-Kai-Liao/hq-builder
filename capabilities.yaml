# Declarations only. Credentials come from the runtime, never from here.
tools: [bash, file edit, bin/hq-new, bin/hq (to verify agents)]
state:
  - <agents folder>/        # the agents it builds, each its own git repo (never their memory/)
  - kernel/PROTOCOL.md      # read; changes are proposed, not made
access: write <agents folder>/<name>/ except memory/; propose kernel changes
